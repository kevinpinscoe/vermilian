nodeLinker: hoisted
blockExoticSubdeps: false
allowBuilds:
  electron-winstaller: true
  esbuild: true
  # Native deps of @electron-forge/maker-dmg (macOS .dmg). pnpm 11 blocks their
  # build scripts by default, which exits non-zero (ERR_PNPM_IGNORED_BUILDS).
  fs-xattr: true
  macos-alias: true
# Pin the whole tree to one Vite 6 so vitest and @electron-forge/plugin-vite
# resolve the same copy (a floating range let vitest pull a nested pre-release
# Vite whose SSR transform broke: ReferenceError: __vite_ssr_exportName__).
# Vite >= 6.4.3 also clears the vite/esbuild Dependabot advisories
# (GHSA-fx2h-pf6j-xcff, GHSA-v6wh-96g9-6wx3, GHSA-4w7w-66w2-5vf9) and drags
# esbuild >= 0.25.0 (GHSA-67mh-4wv8-2f99). @electron-forge/plugin-vite@7.11 has
# no vite peer/dep pin and @vitejs/plugin-react@5.2 supports vite 6 (5.2.0 is the
# newest plugin-react whose peer range still covers vite 6 — 6.x requires vite 8).
overrides:
  vite: ^6.4.3
  esbuild: ^0.25.0
  # Security (Dependabot) — pin patched versions of transitive dev-toolchain
  # deps. None of these ship in the packaged app (electron-forge bundles only
  # `dependencies`); they are build/test/CLI tooling only.
  undici: ^7.28.0
  tmp: ^0.2.6
  tar: ^7.5.18
  js-yaml: ^4.2.0
  "@babel/core": ^7.29.6
  postcss: ^8.5.18
  fast-uri: ^3.1.4
  # brace-expansion is vulnerable on every major line it ships, across a chain of
  # three advisories now. Pin each major to its own patched release rather than
  # forcing one major everywhere: this tree resolves minimatch 3, 5, 9 and 10 at
  # once, and they do not share a brace-expansion major.
  #
  #   GHSA-3jxr-9vmj-r5cp                    fixed 1.1.16 / 2.1.2 / 5.0.7
  #   GHSA-mh99-v99m-4gvg  CVE-2026-14257    fixed 1.1.17 / 2.1.3 / 5.0.8
  #   GHSA-rgw5-rvv9-x895  CVE-2026-69152    fixed 1.1.18 / 2.1.4 / 5.0.9
  #
  # The floors below are CVE-2026-69152's. Stopping at CVE-2026-14257's would be
  # stale on arrival — that advisory's own summary is "DoS via unbounded
  # intermediate arrays, bypassing the CVE-2026-14257 mitigation."
  #
  # The 5.x pin is new. 5.0.8 was already in the tree via minimatch@10 and is
  # vulnerable to CVE-2026-69152; GitHub auto-dismissed that alert as
  # `development` scope, so nothing would have chased it.
  "brace-expansion@1": ^1.1.18
  "brace-expansion@2": ^2.1.4
  "brace-expansion@5": ^5.0.9
