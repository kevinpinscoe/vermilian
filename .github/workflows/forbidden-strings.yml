name: Forbidden strings

# Keeps this public repository free of employer names, personal data and local
# database files (ADR-0011; Jira proposal B7).
#
# The denylist is NOT in the repository — a check that greps for forbidden
# words would itself contain them. It lives in the repository secret
# FORBIDDEN_STRINGS: one fixed string per line, matched case-insensitively.
# Dependabot pull requests cannot read Actions secrets, so the same value must
# also be set as a Dependabot secret of the same name. A missing secret fails
# the job (fail closed) rather than passing silently.
#
# Scanned: every tracked file's content and path at the PR head, the PR's
# commit messages, and the PR title and body. Also fails on any committed
# SQLite database or Runway metadata snapshot (by name or by SQLite header).
#
# Findings print only the location and the pattern's line number, never the
# matched text or the pattern: Actions logs on a public repository are public.
# Every pattern is also registered with ::add-mask:: before scanning.
#
# The checker's own self-test (made-up patterns only) runs first.
#
# Security model (keep it this way; the patterns must stay private):
# - Trigger is `pull_request`, never `pull_request_target` or `workflow_run`.
#   Fork PRs get no secrets, so fork code never sees the patterns; the scan
#   fails closed there and a maintainer runs the script locally instead.
# - Dependabot PRs get only Dependabot secrets, hence the second copy. This
#   job installs no dependencies and runs no project code, so nothing from a
#   dependency update ever executes next to the secret. Do not add install,
#   build or test steps to this job.
# - Only the Scan step receives the secret. Never add `set -x`, and never print
#   FORBIDDEN_PATTERNS: GitHub does not guarantee redaction of a multi-line
#   secret, so the script's own masking and location-only output are what
#   keep the patterns out of the public log.
# - Anyone with write access can read repository secrets (GitHub's model), so
#   the list is only as private as the set of people with write access.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forbidden-strings-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Forbidden strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test the checker
        run: bash scripts/check-forbidden-strings.test.sh

      # PR text comes in through env vars, never interpolated into the script,
      # so a crafted title or body cannot inject shell.
      - name: Collect PR title, body and commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/fs"
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/fs/pr-title.txt"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/fs/pr-body.txt"
          git log --format='%B' "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/fs/commit-messages.txt"

      - name: Scan
        env:
          FORBIDDEN_PATTERNS: ${{ secrets.FORBIDDEN_STRINGS }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ -z "$FORBIDDEN_PATTERNS" && "$GITHUB_EVENT_NAME" == "pull_request" \
                && "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::This PR comes from a fork, and GitHub does not pass secrets to fork PRs, so the forbidden-strings list is unavailable. A maintainer must run scripts/check-forbidden-strings.sh locally against this PR before merging."
            exit 1
          fi
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--text "PR title=$RUNNER_TEMP/fs/pr-title.txt")
            args+=(--text "PR body=$RUNNER_TEMP/fs/pr-body.txt")
            args+=(--text "commit messages=$RUNNER_TEMP/fs/commit-messages.txt")
          fi
          bash scripts/check-forbidden-strings.sh "${args[@]}"
